<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot Team Countdown</title>
    <meta
      name="description"
      content="นับถอยหลังเวลาเลิกงาน 17:30 ตามเวลาไทยสำหรับทีม AI Chatbot"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="hero-grid">
          <div class="content-column">
            <p class="eyebrow">AI CHATBOT TEAM</p>
            <h1>Countdown เลิกงาน</h1>

            <div class="countdown" aria-live="polite">
              <div class="time-box">
                <span id="hours" class="time-value">00</span>
                <span class="time-label">ชั่วโมง</span>
              </div>
              <div class="time-box">
                <span id="minutes" class="time-value">00</span>
                <span class="time-label">นาที</span>
              </div>
              <div class="time-box">
                <span id="seconds" class="time-value">00</span>
                <span class="time-label">วินาที</span>
              </div>
            </div>

            <section class="progress-section" aria-label="ความคืบหน้าของวันทำงาน">
              <div class="progress-header">
                <p id="progressStatus" class="progress-status">09:30 - 17:30</p>
                <p id="progressPercent" class="progress-percent">0%</p>
              </div>
              <div
                class="progress-track"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div id="progressFill" class="progress-fill">
                  <span class="progress-coffee">☕</span>
                </div>
              </div>
              <div class="progress-meta">
                <span>09:30</span>
                <span>17:30</span>
              </div>
            </section>

            <div class="status-panel">
              <p id="statusText" class="status-text">กำลังคำนวณเวลา...</p>
              <p class="timezone-pill">Timezone: Asia/Bangkok (UTC+7)</p>
            </div>

            <div class="actions">
              <button id="shareButton" class="primary-button" type="button">
                คัดลอกลิงก์ไว้แชร์ทีม
              </button>
            </div>
          </div>

          <aside class="meme-stage-card" aria-live="polite">
            <div class="meme-topbar">
              <p class="meme-label">MEME WALL</p>
              <button id="shuffleMemeButton" class="ghost-button" type="button">
                สุ่มใหม่
              </button>
            </div>

            <div class="meme-wall">
              <a
                id="memePrimaryLink"
                class="meme-frame meme-frame-primary"
                href="https://giphy.com/search/%E0%B9%80%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B8%87%E0%B8%B2%E0%B8%99"
                target="_blank"
                rel="noreferrer"
              >
                <img
                  id="memePrimaryImage"
                  class="meme-image"
                  src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzc2ZHRwYTFoZGJ5d2Y1Z2h1dnlzbmpuYjlzODE2ZW9zcm5uMThuaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/PFU8k1XXgytJVWZykC/giphy.gif"
                  alt="Random quitting time meme"
                  loading="lazy"
                />
              </a>

              <div class="meme-stack">
                <a
                  id="memeSecondaryLink1"
                  class="meme-frame meme-frame-secondary"
                  href="https://giphy.com/search/%E0%B9%80%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B8%87%E0%B8%B2%E0%B8%99"
                  target="_blank"
                  rel="noreferrer"
                >
                  <img
                    id="memeSecondaryImage1"
                    class="meme-image meme-image-secondary"
                    src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzc2ZHRwYTFoZGJ5d2Y1Z2h1dnlzbmpuYjlzODE2ZW9zcm5uMThuaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/q4QfjGnFKryzjosj1g/giphy.gif"
                    alt="Random quitting time meme"
                    loading="lazy"
                  />
                </a>
                <a
                  id="memeSecondaryLink2"
                  class="meme-frame meme-frame-secondary"
                  href="https://giphy.com/search/%E0%B9%80%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B8%87%E0%B8%B2%E0%B8%99"
                  target="_blank"
                  rel="noreferrer"
                >
                  <img
                    id="memeSecondaryImage2"
                    class="meme-image meme-image-secondary"
                    src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzc2ZHRwYTFoZGJ5d2Y1Z2h1dnlzbmpuYjlzODE2ZW9zcm5uMThuaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xUA7b30EbtkaMHvRgk/giphy.gif"
                    alt="Random quitting time meme"
                    loading="lazy"
                  />
                </a>
                <a
                  id="memeSecondaryLink3"
                  class="meme-frame meme-frame-secondary"
                  href="https://giphy.com/search/%E0%B9%80%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B8%87%E0%B8%B2%E0%B8%99"
                  target="_blank"
                  rel="noreferrer"
                >
                  <img
                    id="memeSecondaryImage3"
                    class="meme-image meme-image-secondary"
                    src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzc2ZHRwYTFoZGJ5d2Y1Z2h1dnlzbmpuYjlzODE2ZW9zcm5uMThuaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/l0MYt5jPR6QX5pnqM/giphy.gif"
                    alt="Random quitting time meme"
                    loading="lazy"
                  />
                </a>
              </div>
            </div>

            <div class="meme-footer">
              <a
                id="memeLink"
                class="meme-link"
                href="https://giphy.com/search/%E0%B9%80%E0%B8%A5%E0%B8%B4%E0%B8%81%E0%B8%87%E0%B8%B2%E0%B8%99"
                target="_blank"
                rel="noreferrer"
              >
                เปิด Giphy
              </a>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
