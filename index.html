<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot Team Countdown</title>
    <meta
      name="description"
      content="นับถอยหลังเวลาเลิกงาน 17:30 ตามเวลาไทยสำหรับทีม AI Chatbot"
    />
    <meta property="og:title" content="AI Chatbot Team Countdown" />
    <meta
      property="og:description"
      content="นับถอยหลังเวลาเลิกงาน 17:30 ตามเวลาไทยสำหรับทีม AI Chatbot"
    />
    <meta property="og:image" content="image.png" />
    <meta property="og:image:width" content="1858" />
    <meta property="og:image:height" content="1104" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Chatbot Team Countdown" />
    <meta
      name="twitter:description"
      content="นับถอยหลังเวลาเลิกงาน 17:30 ตามเวลาไทยสำหรับทีม AI Chatbot"
    />
    <meta name="twitter:image" content="image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="hero-grid">
          <div class="content-column">
            <!-- <p class="eyebrow">AI CHATBOT TEAM</p> -->
            <h1>Countdown เลิกงาน</h1>

            <div class="countdown" aria-live="polite">
              <div class="time-box">
                <span id="hours" class="time-value">00</span>
                <span class="time-label">ชั่วโมง</span>
              </div>
              <div class="time-box">
                <span id="minutes" class="time-value">00</span>
                <span class="time-label">นาที</span>
              </div>
              <div class="time-box">
                <span id="seconds" class="time-value">00</span>
                <span class="time-label">วินาที</span>
              </div>
            </div>

            <section class="progress-section" aria-label="ความคืบหน้าของวันทำงาน">
              <div class="progress-header">
                <p id="progressPercent" class="progress-percent">0%</p>
              </div>
              <div
                class="progress-track"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div id="progressFill" class="progress-fill">
                  <span class="progress-coffee">
                    <img
                      src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExNnE5b3pvN2M1YXBoMmg5a3J6bm5uZW55eWs0bmRianU2MjVlMHQ3ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/32XlENUo1ZSG0gK43h/giphy.gif"
                      alt="burning focus"
                      width="56"
                      height="56"
                    />
                  </span>
                </div>
              </div>
              <div class="progress-meta">
                <span>09:30</span>
                <span class="lunch-break">พักเที่ยง 12:00 - 13:15</span>
                <span>17:30</span>
              </div>
            </section>

            <div class="status-panel">
              <p id="statusText" class="status-text">กำลังคำนวณเวลา...</p>
              <p class="timezone-pill">Timezone: Asia/Bangkok</p>
            </div>

            <div class="actions">
              <button id="shareButton" class="primary-button" type="button">
                คัดลอกลิงก์ไว้แชร์ทีม
              </button>
            </div>
          </div>

          <aside class="meme-stage-card" aria-live="polite">
            <div class="meme-topbar">
              <!-- <p class="meme-label">MEME WALL</p> -->
              <button id="shuffleMemeButton" class="ghost-button" type="button">
                สุ่มใหม่
              </button>
            </div>

            <div class="meme-wall">
              <a
                id="memePrimaryLink"
                class="meme-frame meme-frame-primary"
                href="https://giphy.com/gifs/EtB1yylKGGAUg"
                target="_blank"
                rel="noreferrer"
              >
                <img
                  id="memePrimaryImage"
                  class="meme-image"
                  src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2p3aXg4ZHoxaDdqNXdjYnJvNXc0bmtjZDcxeHE3cHJyeHNmb2xiNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/EtB1yylKGGAUg/giphy.gif"
                  alt="Random quitting time meme"
                  loading="lazy"
                />
              </a>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
